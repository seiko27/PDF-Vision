<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éditeur PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{--bg:#e9ebef;--bar:#fff;--fg:#1c1f26;--mut:#667085;--bd:#d0d5dd;--ac:#2563eb;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14161a;--bar:#20242b;--fg:#eceef2;--mut:#98a2b3;--bd:#363c46;--ac:#6b9bff;--on:#0b1020}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--bd)}
#bar .sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
button,input{font:inherit;color:var(--fg)}
button{background:var(--bar);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
select{font:inherit;color:var(--fg);background:var(--bar);border:1px solid var(--bd);border-radius:7px;padding:5px;max-width:150px}
input[type=number]{width:54px;padding:5px;background:var(--bar);border:1px solid var(--bd);border-radius:7px}
input[type=color]{width:34px;height:30px;padding:1px;border:1px solid var(--bd);border-radius:7px;background:var(--bar)}
#msg{margin-left:auto;color:var(--mut);font-size:12px}
#doc{flex:1;overflow:auto}
#in{display:flex;flex-direction:column;align-items:center;min-width:max-content;padding:10px}
#empty{margin:12vh auto;text-align:center;color:var(--mut);max-width:420px;line-height:1.6}
.page{position:relative;flex:none;margin:8px 0;background:#fff;box-shadow:0 2px 10px #0004}
.page canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0}
.mask,.ghost,.obj,.band{position:absolute}
.ghost{cursor:pointer}
.ghost:hover{outline:1.5px dashed var(--ac);background:#2563eb14}
body[data-tool=text] .ghost,body[data-tool=cap] .ghost{pointer-events:none}
body[data-tool=text] .ov{cursor:text}
body[data-tool=cap] .ov{cursor:crosshair}
.obj{white-space:pre;font-family:Helvetica,Arial,sans-serif;cursor:move;min-width:12px;min-height:1em;user-select:none;-webkit-user-select:none;color:#000}
.obj.text:hover{outline:1px dashed var(--ac);outline-offset:3px}
.obj.sel{outline:1.5px solid var(--ac);outline-offset:3px}
.obj[contenteditable=plaintext-only],.obj[contenteditable=true]{cursor:text;outline:2px solid var(--ac);background:#fff9;user-select:text;-webkit-user-select:text}
.obj img{width:100%;height:100%;display:block;pointer-events:none}
.rh{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--ac);border-radius:3px;cursor:nwse-resize;display:none}
.obj.sel .rh{display:block}
.band{pointer-events:none;border:1.5px dashed var(--ac);background:#2563eb22}
.tl{position:absolute;inset:0;overflow:hidden;line-height:1}
.tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}

.ov{pointer-events:none}
.obj{pointer-events:auto}

#fl[hidden]{display:none}
body[data-tool=elt] .ov{pointer-events:auto;cursor:pointer}
.hl{position:absolute;pointer-events:none;border:1.5px solid var(--ac);background:#2563eb22}
</style></head>
<body data-tool="sel">
<div id="bar">
  <button id="open" class="pri">Ouvrir un PDF</button>
  <span class="sep"></span>
  <button data-t="sel" class="on" title="Sélectionner le texte en glissant, puis le modifier ou le déplacer">Sélection</button>

  <button id="img">Insérer une image</button>
  <span class="sep"></span>
  <select id="font" title="Police"></select>
  <input id="size" type="number" min="4" max="200" value="14" title="Taille du texte">
  <input id="color" type="color" value="#000000" title="Couleur du texte">
  <button id="bold" title="Gras"><b>G</b></button><button id="ital" title="Italique"><i>I</i></button><button id="addfont" title="Importer une police .ttf / .otf">+ Police</button>
  <button id="del">Supprimer</button>
  <button id="undo">Annuler</button>
  <span class="sep"></span>
  <button id="zo">−</button><button id="zi">+</button>
  <button id="save" class="pri">Enregistrer le PDF</button>
  <span id="msg"></span>
</div>
<div id="doc"><div id="in"><div id="empty"><h2>Ouvrez ou déposez un PDF</h2>Cliquez sur un texte existant pour le modifier ou le déplacer, ajoutez du texte, insérez des images, ou encadrez une image ou un bloc avec « Capturer une zone » pour le déplacer.</div></div></div>
<div id="fl" hidden><button id="fe" class="pri">Modifier / déplacer</button><button id="fd">Supprimer</button></div>
<input id="ff" type="file" accept=".ttf,.otf,.woff" hidden><input id="f" type="file" accept="application/pdf" hidden><input id="fi" type="file" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s),IN=$('#in');

function build(){

// Dessine la page SANS les lignes déjà converties : le texte d'origine est réellement retiré du rendu (le fond reste intact)

    if(p.masks.some(m=>m.k==='e'+g.id))continue;const c=g.r;
    const X=Math.max(0,Math.round(c.x*k)),Y=Math.max(0,Math.round(c.y*k)),W=Math.max(1,Math.min(cv.width-X,Math.round(c.w*k))),Hh=Math.max(1,Math.min(cv.height-Y,Math.round(c.h*k)));
    const t=document.createElement('canvas');t.width=W;t.height=Hh;t.getContext('2d').drawImage(cv,X,Y,W,Hh,0,0,W,Hh);

// Intercepte les dessins du rendu pdf.js : liste des éléments (images, formes) avec leur cadre, et possibilité d'en sauter certains

async function isoRender(i,idx){
  const page=await pdf.getPage(i+1),k=Math.min(Math.max(zoom*(devicePixelRatio||1),2),4),vp=page.getViewport({scale:k}),cv=document.createElement('canvas');

function evOk(i){const p=st[i],A=p.W*p.H,gone=new Set(p.eg.flatMap(g=>g.idx));return n=>{const e=p.ev[n];return !!e&&!gone.has(n)&&(e.w>0||e.h>0)&&e.w*e.h<=.85*A}}

  const p=st[i];if(!p.ev)return[];const ok=evOk(i);let n=-1;
  for(let m=p.ev.length-1;m>=0;m--){if(!ok(m))continue;const e=p.ev[m];if(a.x>=e.x-1&&a.x<=e.x+e.w+1&&a.y>=e.y-1&&a.y<=e.y+e.h+1){n=m;break}}

function evsIn(i,q){const p=st[i];if(!p.ev)return[];const ok=evOk(i),o=[];p.ev.forEach((e,n)=>{if(ok(n)&&e.x>=q.x-1&&e.y>=q.y-1&&e.x+e.w<=q.x+q.w+1&&e.y+e.h<=q.y+q.h+1)o.push(n)});return o}
function hoverElt(ev,i){
  const o=ovl(i);if(!o)return;let h=o.querySelector('.hl');const g=eltGroup(i,pt(ev,i));
  if(!g.length){if(h)h.remove();return}
  const b=g.map(n=>st[i].ev[n]),x0=Math.min(...b.map(e=>e.x)),y0=Math.min(...b.map(e=>e.y)),x1=Math.max(...b.map(e=>e.x+e.w)),y1=Math.max(...b.map(e=>e.y+e.h));

// Détache des éléments : rendu isolé (fond transparent) -> objet déplaçable ; la page est redessinée sans eux
async function grab(i,idx){
  const p=st[i];idx=idx.filter(n=>p.ev[n]&&!p.eg.some(g=>g.idx.includes(n)));if(!idx.length)return;

async function repaint(i){if(el(i).querySelector('canvas'))await paintCanvas(i)}

function fdet(nm,css){
  const mono=/mono|courier|consol|typewriter/i.test(nm)||(!nm&&css==='monospace');

  return{font:mono?'cour':serif?'times':'helv',bold:/bold|black|heavy|semibold|demi/i.test(nm),italic:/italic|oblique/i.test(nm)};
}
const sameF=(a,b)=>a.pk===b.pk&&a.font===b.font&&a.bold===b.bold&&a.italic===b.italic;
function group(tc,H,page){

    const x=t[4],yb=t[5],w=it.width,l=L[L.length-1];

function mkBlocks(Ls){

  const rgb=h=>PDFLib.rgb(...[1,3,5].map(k=>parseInt(h.substr(k,2),16)/255)),pages=doc.getPages(),cache={};
  const S=PDFLib.StandardFonts,NM={helv:['Helvetica','HelveticaBold','HelveticaOblique','HelveticaBoldOblique'],times:['TimesRoman','TimesRomanBold','TimesRomanItalic','TimesRomanBoldItalic'],cour:['Courier','CourierBold','CourierOblique','CourierBoldOblique']};
  const sf=async(fm,b,it)=>{const key=fm+b+it;if(!cache[key])cache[key]=await doc.embedFont(S[(NM[fm]||NM.helv)[(b?1:0)+(it?2:0)]]);return cache[key]};
  const ef=async F=>{const key='e'+F.k;if(cache[key]===undefined){try{cache[key]=await doc.embedFont(F.bytes,{subset:!F.pdf})}catch(e){cache[key]=null}}return cache[key]};
  for(let i=0;i<st.length;i++){
    const p=st[i],pg=pages[i],OX=p.ox||0,H=p.H+(p.oy||0);
    for(const m of p.masks){
      if(m.src){const im=await doc.embedPng(m.src);pg.drawImage(im,{x:OX+m.x,y:H-m.y-m.h,width:m.w,height:m.h})}
      else pg.drawRectangle({x:OX+m.x,y:H-m.y-m.h,width:m.w,height:m.h,color:rgb(m.c||'#ffffff'),borderWidth:0});
    }
    for(const o of p.objs){
      if(o.t==='img'){const im=await doc.embedPng(o.src);pg.drawImage(im,{x:OX+o.x,y:H-o.y-o.h,width:o.w,height:o.h});continue}
      const F=FONTS.find(x=>x.k===o.font)||FONTS[0],fb=F.bytes?(o.fb||{font:'helv',bold:o.bold,italic:o.italic}):{font:o.font,bold:o.bold,italic:o.italic};
      const emb=F.bytes?await ef(F):null,std=await sf(fb.font,!!fb.bold,!!fb.italic),lines=o.text.split('\n'),ls=o.ls||0;
      const pick=ch=>emb&&(!F.fk||F.fk.hasGlyphForCodePoint(ch.codePointAt(0)))?emb:std;
      const enc=(ch,f)=>f===std&&!/[\x20-\x7E\xA0-\xFF€‘’“”–—…•]/.test(ch)?'?':ch;
      for(let j=0;j<lines.length;j++){
        const ln=lines[j];if(!ln.trim())continue;
        const y=H-o.y-o.size*(o.lh/2+.3465)-j*o.lh*o.size,chars=[...ln],fs=chars.map(pick),op={y,size:o.size,color:rgb(o.color)};
        try{
          if(Math.abs(ls)<.005&&fs.every(f=>f===fs[0]))pg.drawText(chars.map(c=>enc(c,fs[0])).join(''),{...op,font:fs[0],x:OX+o.x});
          else{let x=OX+o.x;chars.forEach((c,q)=>{const t=enc(c,fs[q]);if(c!==' ')pg.drawText(t,{...op,font:fs[q],x});x+=fs[q].widthOfTextAtSize(t,o.size)+ls})}
        }catch(e){}
      }
    }
  }
  const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'}),name=fname.replace(/\.pdf$/i,'')+'-modifie.pdf';
  try{
    const dl=window.claude?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:blob});msg('Prêt')}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();msg('Prêt')}
  }catch(e){msg(e&&e.code==='declined'?'Enregistrement annulé':'Enregistrement impossible')}
}
function flUpdate(){
  const fl=$('#fl'),q=tool==='sel'?selLines():null;
  if(!q||!q.idx.length){fl.hidden=true;return}
  const r=getSelection().getRangeAt(0).getBoundingClientRect();fl.hidden=false;
  fl.style.left=Math.max(6,Math.min(innerWidth-230,r.left))+'px';fl.style.top=Math.max(6,r.top-46)+'px';
}
$('#fl').onmousedown=e=>e.preventDefault();
$('#fe').onclick=async()=>{$('#fl').hidden=true;const os=await editSel();if(os&&os.length===1)startEdit(sel.i,os[0])};
$('#fd').onclick=()=>{eraseSel();$('#fl').hidden=true};
addEventListener('pointerup',e=>{if(!(e.target.closest&&e.target.closest('#fl')))setTimeout(flUpdate,0)});
addEventListener('pointerdown',e=>{if(!(e.target.closest&&e.target.closest('#fl')))$('#fl').hidden=true},true);
$('#open').onclick=()=>$('#f').click();$('#f').onchange=e=>openFile(e.target.files[0]);
$('#img').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{addImage(e.target.files[0]);e.target.value=''};
$('#addfont').onclick=()=>$('#ff').click();$('#ff').onchange=e=>{addFont(e.target.files[0]);e.target.value=''};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('#font').onchange=e=>setProp('font',e.target.value);
$('#size').onchange=e=>setProp('size',Math.max(4,+e.target.value||14));
$('#color').onchange=e=>setProp('color',e.target.value);
for(const[id,k]of[['#bold','bold'],['#ital','italic']])$(id).onclick=()=>{const b=$(id);if(!setProp(k,!b.classList.contains('on')))b.classList.toggle('on');else props()};
$('#del').onclick=()=>{if(sel&&sel.ids.length)delSel();else eraseSel()};$('#undo').onclick=doUndo;$('#save').onclick=save;
$('#zi').onclick=()=>{if(pdf){zoom=Math.min(3,zoom+.2);build()}};$('#zo').onclick=()=>{if(pdf){zoom=Math.max(.5,zoom-.2);build()}};
addEventListener('keydown',e=>{
  const t=e.target;if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.isContentEditable)return;
  const m=e.ctrlKey||e.metaKey,has=sel&&sel.ids.length;
  if(m&&e.key==='z'){e.preventDefault();doUndo()}
  else if(m&&e.key==='d'){e.preventDefault();dupSel()}
  else if(e.key==='Delete'||e.key==='Backspace'){if(has)delSel();else{e.preventDefault();eraseSel()}}
  else if(e.key==='Enter'&&!has&&selLines()){e.preventDefault();$('#fl').hidden=true;(async()=>{const os=await editSel();if(os&&os.length===1)startEdit(sel.i,os[0])})()}
  else if(e.key==='Escape'){sel=null;mark();getSelection().removeAllRanges();$('#fl').hidden=true}
  else if(e.key.startsWith('Arrow')&&has){e.preventDefault();const s=e.shiftKey?10:1;nudge(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0)}
});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&/pdf/i.test(f.type))openFile(f)});
